name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run build
        run: pnpm run build

      - name: Drive the built nodes with a stubbed n8n
        run: pnpm test

      - name: Check what the package would ship
        # The tarball must carry the built nodes and the docs, and nothing
        # from the build cache. A stray tsbuildinfo once added 88 KB to
        # every install for no reason.
        run: |
          npm pack --dry-run --ignore-scripts 2>&1 | tee pack.log
          if grep -qE 'tsbuildinfo|dist/package\.json' pack.log; then
            echo 'The package would ship build artefacts it should not.'
            exit 1
          fi
          grep -q 'docs/' pack.log || { echo 'The docs folder is missing from the package.'; exit 1; }
